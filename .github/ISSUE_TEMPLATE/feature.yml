name: Feature
description: Plan a scoped implementation slice.
title: "[Feature]: "
labels: ["feature"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should change or exist when this issue is complete?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Files, modules, or behavior expected to be touched.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: Concrete checks that prove completion.
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Risks
      description: Security, data, cost, or compatibility risks.
