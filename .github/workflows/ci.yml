name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.95.0
      - name: Install pinned Rust audit tool
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit Rust dependencies
        # SQLx's macros feature leaves optional MySQL packages in Cargo.lock,
        # but this SQLite-only workspace does not compile that backend. Keep
        # the advisory ignored only while the reachability proof below holds.
        run: cargo audit --ignore RUSTSEC-2023-0071

      - name: Prove ignored RSA advisory is unreachable
        run: |
          if cargo tree --locked --target all -e normal,build -i rsa | grep -q '^rsa '; then
            echo 'RUSTSEC-2023-0071 is reachable; remove the ignore and remediate the dependency.' >&2
            exit 1
          fi

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ] &&
             [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            git diff --check "$BASE_SHA"...HEAD
          else
            git diff --check HEAD^
          fi

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Check Rust workspace
        run: cargo check --workspace --locked

      - name: Lint Rust workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test Rust workspace
        run: cargo test --workspace --all-targets --locked

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Audit web dependencies
        working-directory: web
        run: |
          attempt=1
          while [ "$attempt" -le 4 ]; do
            echo "npm audit attempt ${attempt}/4"
            if timeout 60 npm audit --audit-level=high --fetch-retries=1; then
              exit 0
            fi
            attempt=$((attempt + 1))
            sleep 20
          done
          echo "npm audit failed after 4 attempts"
          exit 1

      - name: Test web
        working-directory: web
        run: npm test

      - name: Build web
        working-directory: web
        run: npm run build

      - name: Install Chromium for canvas browser tests
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Test React Flow canvas in Chromium
        working-directory: web
        run: npm run test:e2e

      - name: Smoke release topology
        run: ./scripts/smoke-release.sh
