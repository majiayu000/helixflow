name: specrail-check

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "AGENTS.md"
      - "AGENT_USAGE.md"
      - "workflow.yaml"
      - "states.yaml"
      - "labels.yaml"
      - "skills-lock.json"
      - "checks/**"
      - "tools/install_codex_skills.py"
      - "skills/**"
      - "templates/**"
      - "schemas/**"
      - "review/**"
      - "policies/**"
      - "integrations/**"
      - "locales/**"
      - "examples/**"
      - "docs/ADOPTION_MATRIX.md"
      - "specs/GH*/**"
  push:
    branches:
      - main
    paths:
      - "AGENTS.md"
      - "AGENT_USAGE.md"
      - "workflow.yaml"
      - "states.yaml"
      - "labels.yaml"
      - "skills-lock.json"
      - "checks/**"
      - "tools/install_codex_skills.py"
      - "skills/**"
      - "templates/**"
      - "schemas/**"
      - "review/**"
      - "policies/**"
      - "integrations/**"
      - "locales/**"
      - "examples/**"
      - "docs/ADOPTION_MATRIX.md"
      - "specs/GH*/**"

permissions:
  contents: read

jobs:
  specrail-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check SpecRail workflow pack
        env:
          SPEC_CHANGED_FROM: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: python3 checks/check_workflow.py --repo . --all-specs --changed-specs-from "$SPEC_CHANGED_FROM"
      - name: Preview local skill install
        run: python3 tools/install_codex_skills.py --repo .
      - name: Check whitespace
        run: git diff --check
