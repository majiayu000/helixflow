[workspace]
members = [
  "crates/agent",
  "crates/gateway",
  "crates/graph",
  "crates/registry",
  "crates/run",
  "crates/server",
  "crates/store",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "UNLICENSED"
repository = "https://github.com/majiayu000/helixflow"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
futures-util = "0.3"
helixflow-gateway = { path = "crates/gateway" }
helixflow-graph = { path = "crates/graph" }
helixflow-registry = { path = "crates/registry" }
helixflow-run = { path = "crates/run" }
helixflow-store = { path = "crates/store" }
mime = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = "0.29"
uuid = { version = "1", features = ["v7", "serde"] }
